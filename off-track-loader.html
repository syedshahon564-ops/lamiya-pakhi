<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Off-Track Coil Loader</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border: 0;
    }

    :root {
      --surface: hsl(250, 15%, 96%);
      --ink: hsl(250, 15%, 12%);
      font-size: clamp(16px, calc(16px + (24 - 16) * (100vw - 320px) / 960), 24px);
    }

    body {
      background-color: var(--surface);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: background-color 0.3s;
    }

    .loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 4rem;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06);
    }

    .coil {
      width: 8em;
      height: 8em;
      animation: jolt 1.5s ease-in-out infinite;
      transform-origin: center;
    }

    .coil-track {
      fill: none;
      stroke: hsla(250, 15%, 12%, 0.08);
      stroke-width: 16;
      stroke-linecap: round;
      transition: stroke 0.3s;
    }

    .coil-strand {
      fill: none;
      stroke: url(#coil-gradient);
      stroke-width: 16;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 44 1111;
      stroke-dashoffset: 10;
      animation: spiral 3s cubic-bezier(0.42, 0.17, 0.75, 0.83) infinite;
    }

    @keyframes jolt {
      0%, 100% {
        transform: rotate(0deg);
      }
      20% {
        transform: rotate(-6deg);
      }
      45% {
        transform: rotate(12deg);
      }
      70% {
        transform: rotate(-4deg);
      }
    }

    @keyframes spiral {
      from { stroke-dashoffset: 10;   }
      25%  { stroke-dashoffset: 295;  }
      to   { stroke-dashoffset: 1165; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: hsl(250, 15%, 10%);
        --ink: hsl(250, 15%, 92%);
      }

      .loader-card {
        background: rgba(255, 255, 255, 0.03);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }

      .coil-track {
        stroke: hsla(250, 15%, 92%, 0.08);
      }
    }
  </style>
</head>
<body>
  <div class="loader-card">
    <svg
      class="coil"
      viewBox="0 0 128 128"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Loading"
    >
      <defs>
        <linearGradient id="coil-gradient" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"   stop-color="hsl(270, 85%, 65%)" />
          <stop offset="50%"  stop-color="hsl(330, 90%, 60%)" />
          <stop offset="100%" stop-color="hsl(20,  95%, 60%)" />
        </linearGradient>
      </defs>
      <circle class="coil-track" r="56" cx="64" cy="64" />
      <path
        class="coil-strand"
        d="M92,15.492S78.194,4.967,66.743,16.887
           c-17.231,17.938-28.26,96.974-28.26,96.974
           L119.85,59.892l-99-31.588,57.528,89.832
           L97.8,19.349,13.636,88.51l89.012,16.015
           S81.908,38.332,66.1,22.337
           C50.114,6.156,36,15.492,36,15.492
           a56,56,0,1,0,56,0Z"
      />
    </svg>
  </div>
</body>
</html>
